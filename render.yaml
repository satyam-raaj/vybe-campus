services:
  - type: web
    name: vybe-campus
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: VYBE_ADMIN_INITIAL_PASSWORD
        sync: false
      - key: VYBE_SECRET_KEY
        generateValue: true
      - key: VYBE_PASSKEY_RP_ID
        value: vybe-campus.onrender.com
      - key: VYBE_PASSKEY_ORIGIN
        value: https://vybe-campus.onrender.com
